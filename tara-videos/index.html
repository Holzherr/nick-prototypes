:root{--bg:#fdf8f1;--ink:#2d2a26;--card:#fff;--accent:#e85d4a}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:22px 20px 8px;max-width:1200px;margin:0 auto}

.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 20px 6px;max-width:1200px;margin:0 auto;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:10px}

#q{border:1.5px solid #ddd3c6;border-radius:999px;padding:7px 14px;font-size:14px;min-width:140px;flex:1;max-width:240px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:14px 20px 60px;max-width:1200px;margin:0 auto}
.v{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(60,40,20,.09);cursor:pointer;transition:transform .12s}
.v:hover{transform:translateY(-3px)}
.thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#f3c14b,#e85d4a)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.len{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600}
.star{position:absolute;left:8px;top:8px;background:#f3c14b;color:#5a4300;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s}
.v:hover .play{opacity:1}
.play span{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;padding-left:4px}
.meta{padding:12px 14px 14px}
.cat{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--accent)}
.meta h3{margin:4px 0 3px;font-size:15px;line-height:1.3}
.ch{color:#8a8177;font-size:12.5px;margin:0}
.why{font-size:13px;color:#5c554d;margin:7px 0 0;line-height:1.4}
dialog{border:0;border-radius:18px;padding:0;max-width:860px;width:calc(100vw - 32px);background:#111;color:#eee}
dialog::backdrop{background:rgba(20,15,10,.75)}
.frame{aspect-ratio:16/9;width:100%}
.frame iframe{width:100%;height:100%;border:0;display:block}
.dmeta{padding:14px 18px 18px}
.dmeta h3{margin:0 0 4px;font-size:17px}
.dmeta p{margin:4px 0;font-size:14px;color:#bbb;line-height:1.45}
.do{background:#2a2320;border-left:3px solid #f3c14b;padding:8px 12px;border-radius:8px;color:#f0e6d8!important;margin-top:10px!important}
.close{position:absolute;top:10px;right:12px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:34px;height:34px;font-size:17px;cursor:pointer;z-index:2}
.ext{color:#f3c14b}
