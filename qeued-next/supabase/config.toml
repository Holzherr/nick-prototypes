# Hosted auth settings, applied with `npx supabase config push` (run `config diff` first).
[auth]
site_url = "https://qeued.com"
additional_redirect_urls = [
  "https://qeued.com/**",
  "https://www.qeued.com/**",
  "https://holzherr.github.io/nick-prototypes/qeued-next/**",
  "http://localhost:5173/nick-prototypes/qeued-next/**",
]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[functions.mcp]
verify_jwt = false
