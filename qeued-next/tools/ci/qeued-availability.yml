# Weekly UK availability refresh for the qeued catalogue.
#
# It lives here, inside the app, because the agent team may not write under .github/ at the
# repo root. To turn it on, copy this file unchanged to .github/workflows/qeued-availability.yml
# and set QEUED_DB_URL as a repository secret on Holzherr/nick-prototypes. That is the only
# secret it reads: tools/db.mjs runs the SQL through the Supabase CLI over that connection, so
# no other credential is needed.
#
# Runs every Sunday at 03:00 UTC, or by hand from the Actions tab. A hand run with dry_run
# ticked reads the pages, writes nothing, and keeps the SQL it would have run as an artefact.
# Run it that way once after setting the secret, so a runner that cannot reach the pages or
# the database fails in front of you rather than on the first Sunday.
name: qeued availability

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read the pages and keep the SQL as an artefact; write nothing
        type: boolean
        default: false

# Two sweeps writing at once would race on the same rows, so a second run waits for the first.
concurrency:
  group: qeued-availability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: qeued-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qeued-next/package-lock.json
      - run: npm ci
      - name: Refresh stale offers
        env:
          QEUED_DB_URL: ${{ secrets.QEUED_DB_URL }}
        run: node tools/refresh-stale.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Keep the SQL from a dry run
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: offers-sql
          path: qeued-next/offers.sql
          if-no-files-found: error
