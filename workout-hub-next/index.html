<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TigerWorkouts has moved</title>
  <meta http-equiv="refresh" content="0; url=https://tigerworkouts.com/">
  <link rel="canonical" href="https://tigerworkouts.com/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a;
           font: 17px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    main { padding: 24px; text-align: center; }
    a { color: #c42a12; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <p>TigerWorkouts lives at <a href="https://tigerworkouts.com/">tigerworkouts.com</a> now.</p>
    <p>Sign in there and your workouts and history come back.</p>
  </main>
  <script>
    // Retire any worker this address installed before the move, then go. sw.js does the same from
    // the other side for installs that never load this page fresh.
    (async () => {
      try {
        for (const r of await navigator.serviceWorker?.getRegistrations?.() ?? []) await r.unregister();
        for (const k of await caches?.keys?.() ?? []) await caches.delete(k);
      } catch {}
      location.replace('https://tigerworkouts.com/');
    })();
  </script>
</body>
</html>
