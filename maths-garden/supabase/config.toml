project_id = "maths-garden"

# Hosted auth settings, applied with `npx supabase config push --project-ref <ref>` (run `config diff` first).
[auth]
site_url = "https://nickholzherr.com/maths/"
additional_redirect_urls = [
  "https://nickholzherr.com/maths/**",
  "https://holzherr.github.io/nick-prototypes/maths-garden/**",
  "http://localhost:5173/nick-prototypes/maths-garden/**",
]
minimum_password_length = 8

[auth.email]
enable_signup = true
# Parents sign up and play straight away; the data is scoped to their own children by RLS.
enable_confirmations = false
