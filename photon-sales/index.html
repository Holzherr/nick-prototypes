<style>
  :root {

  @media (prefers-color-scheme: dark) {

  .lock { width: 100%; max-width: 390px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px 30px 28px; box-shadow: 0 10px 34px rgba(0,0,0,0.07); }
  .badge { width: 40px; height: 40px; border-radius: 11px; background: rgba(42,120,214,0.10); color: var(--accent); display: grid; place-items: center; margin-bottom: 18px; }
  h1 { font-size: 19px; font-weight: 620; letter-spacing: -0.015em; margin: 0 0 6px; }

  input { width: 100%; font: inherit; font-size: 15px; padding: 11px 13px; border-radius: 9px; border: 1px solid var(--border); background: var(--plane); color: var(--ink); outline: none; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(42,120,214,0.15); }
  button { width: 100%; margin-top: 12px; font: inherit; font-size: 14.5px; font-weight: 600; padding: 11px; border-radius: 9px; border: none; background: var(--accent); color: #fff; cursor: pointer; }
  button:hover { filter: brightness(1.07); }
  button[disabled] { opacity: 0.6; cursor: default; }
  .err { margin-top: 12px; font-size: 13px; color: var(--bad); min-height: 18px; }
  .foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); line-height: 1.5; }

  var ITER = 310000;
  var f = document.getElementById('f'), p = document.getElementById('p'),
      b = document.getElementById('b'), e = document.getElementById('e');

  function b64(s) {
    var bin = atob(s), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

  async function unlock(pass) {
    var raw = b64(BLOB);
    var salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);
    return new TextDecoder().decode(pt);
  }

  function reveal(html) {
    var out = document.getElementById('out');
    out.innerHTML = html;
    out.hidden = false;
    document.getElementById('gate').remove();
    // innerHTML never executes <script>; re-create them so the charts render.
    out.querySelectorAll('script').forEach(function (old) {
      var s = document.createElement('script');
      for (var i = 0; i < old.attributes.length; i++) s.setAttribute(old.attributes[i].name, old.attributes[i].value);
      s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    });
  }

  f.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    e.textContent = '';
    b.disabled = true; b.textContent = 'Decrypting…';
    try {
      var html = await unlock(p.value);
      try { sessionStorage.setItem('pr-key', p.value); } catch (x) {}
      reveal(html);
    } catch (x) {
      e.textContent = 'Wrong passphrase.';
      b.disabled = false; b.textContent = 'Unlock';
      p.select();
    }
  });

  // stay unlocked across reloads within the tab session
  try {
    var saved = sessionStorage.getItem('pr-key');
    if (saved) unlock(saved).then(reveal).catch(function () { sessionStorage.removeItem('pr-key'); });
