name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check every class used in markup has a CSS rule
        run: node tools/check-css.js 'echo/*.html'

  deploy:
    needs: check-css
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workout-hub-next/package-lock.json

      # workout-hub-next is a Vite + Storybook project; it builds into workout-hub-next/dist
      # (app at /, Storybook at /storybook/). Everything else on the site is static.
      - name: Build workout-hub-next
        working-directory: workout-hub-next
        run: |
          npm ci
          npm test
          npm run build
          npm run build-storybook

      # qeued-next is the same shape (Vite + Storybook, base /nick-prototypes/qeued-next/).
      - name: Build qeued-next
        working-directory: qeued-next
        run: |
          npm ci
          npm test
          npm run build
          npm run build-storybook

      # maths-garden is the same shape again (base /nick-prototypes/maths-garden/).
      # check-types and lint were missing here: a type error or a lint regression could reach main and
      # only surface later at build time, or on a device.
      - name: Build maths-garden
        working-directory: maths-garden
        run: |
          npm ci
          npm run check-types
          npm run lint
          npm test
          npm run build
          npm run build-storybook

      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude _site --exclude node_modules --exclude workout-hub-next --exclude qeued-next --exclude maths-garden ./ _site/
          cp -r workout-hub-next/dist _site/workout-hub-next
          cp -r qeued-next/dist _site/qeued-next
          cp -r maths-garden/dist _site/maths-garden

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
